apiVersion: apps/v1
kind: Deployment
metadata:
  name: midas-deployment
  namespace: clarity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midas
  template:
    metadata:
      labels:
        app: midas
    spec:
      nodeSelector:
        kubernetes.io/hostname: meowth
      containers:
      - name: midas-container
        image: ghcr.io/paulsssp/clarity-servicio_midas:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: midas
  namespace: clarity
spec:
  selector:
    app: midas
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
